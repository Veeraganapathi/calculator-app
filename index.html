<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    :root {
      --bg: #1f2937;
      --panel: #111827;
      --button: #374151;
      --button-alt: #4b5563;
      --accent: #38bdf8;
      --text: #f8fafc;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #0f172a 0%, #111827 70%);
      color: var(--text);
      padding: 20px;
    }

    .calculator {
      width: min(360px, 100%);
      background: var(--panel);
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .display {
      padding: 28px 20px;
      text-align: right;
      background: linear-gradient(180deg, rgba(15, 23, 42, 1) 0%, rgba(17, 24, 39, 0.95) 100%);
    }

    .display .history {
      color: #94a3b8;
      font-size: 0.9rem;
      min-height: 1.2rem;
      word-break: break-all;
    }

    .display .current {
      margin-top: 12px;
      font-size: 2.5rem;
      line-height: 1.1;
      word-break: break-all;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 20px;
      background: #111827;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 18px 0;
      font-size: 1.2rem;
      color: var(--text);
      background: var(--button);
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: #475569;
    }

    button.operation {
      background: var(--accent);
      color: #0f172a;
    }

    button.control {
      background: var(--button-alt);
    }

    button.danger {
      background: var(--danger);
    }

    button.span-2 {
      grid-column: span 2;
    }

    @media (max-width: 400px) {
      .calculator {
        border-radius: 20px;
      }
      button {
        padding: 16px 0;
        font-size: 1.1rem;
      }
      .display .current {
        font-size: 2.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="history" id="history"></div>
      <div class="current" id="current">0</div>
    </div>

    <div class="buttons">
      <button class="control danger" data-action="clear">C</button>
      <button class="control" data-action="delete">⌫</button>
      <button class="control" data-action="percent">%</button>
      <button class="operation" data-action="operator">÷</button>

      <button data-digit>7</button>
      <button data-digit>8</button>
      <button data-digit>9</button>
      <button class="operation" data-action="operator">×</button>

      <button data-digit>4</button>
      <button data-digit>5</button>
      <button data-digit>6</button>
      <button class="operation" data-action="operator">−</button>

      <button data-digit>1</button>
      <button data-digit>2</button>
      <button data-digit>3</button>
      <button class="operation" data-action="operator">+</button>

      <button class="span-2" data-digit>0</button>
      <button data-digit>.</button>
      <button class="operation" data-action="equals">=</button>
    </div>
  </div>

  <script>
    const historyEl = document.getElementById('history');
    const currentEl = document.getElementById('current');
    let currentValue = '0';
    let previousValue = '';
    let operator = '';
    let shouldReset = false;

    function updateDisplay() {
      currentEl.textContent = currentValue;
      historyEl.textContent = previousValue + (operator ? ` ${operator}` : '');
    }

    function appendDigit(digit) {
      if (shouldReset) {
        currentValue = '0';
        shouldReset = false;
      }
      if (digit === '.' && currentValue.includes('.')) return;
      currentValue = currentValue === '0' && digit !== '.' ? digit : currentValue + digit;
    }

    function chooseOperator(op) {
      if (operator && !shouldReset) {
        compute();
      }
      operator = op;
      previousValue = currentValue;
      shouldReset = true;
    }

    function compute() {
      const prev = parseFloat(previousValue);
      const current = parseFloat(currentValue);
      if (isNaN(prev) || isNaN(current)) return;
      let result = 0;

      switch (operator) {
        case '+': result = prev + current; break;
        case '−': result = prev - current; break;
        case '×': result = prev * current; break;
        case '÷':
          result = current === 0 ? 'Error' : prev / current;
          break;
        default: return;
      }

      currentValue = result.toString();
      operator = '';
      previousValue = '';
      shouldReset = true;
    }

    function clearCalculator() {
      currentValue = '0';
      previousValue = '';
      operator = '';
      shouldReset = false;
    }

    function deleteDigit() {
      if (shouldReset) return;
      currentValue = currentValue.length === 1 ? '0' : currentValue.slice(0, -1);
    }

    function percent() {
      currentValue = (parseFloat(currentValue) / 100).toString();
      shouldReset = true;
    }

    document.querySelector('.buttons').addEventListener('click', (event) => {
      const target = event.target;
      if (target.matches('[data-digit]')) {
        appendDigit(target.textContent);
        updateDisplay();
        return;
      }
      const action = target.dataset.action;
      if (!action) return;

      switch (action) {
        case 'clear': clearCalculator(); break;
        case 'delete': deleteDigit(); break;
        case 'percent': percent(); break;
        case 'operator': chooseOperator(target.textContent); break;
        case 'equals': compute(); break;
      }
      updateDisplay();
    });

    document.addEventListener('keydown', (event) => {
      const key = event.key;
      if (/\.|\d/.test(key)) {
        appendDigit(key);
      } else if (key === 'Enter' || key === '=') {
        compute();
      } else if (key === 'Backspace') {
        deleteDigit();
      } else if (key.toLowerCase() === 'c') {
        clearCalculator();
      } else if (key === '%') {
        percent();
      } else if (['+', '-', '*', '/'].includes(key)) {
        const map = { '+': '+', '-': '−', '*': '×', '/': '÷' };
        chooseOperator(map[key]);
      } else {
        return;
      }
      event.preventDefault();
      updateDisplay();
    });

    updateDisplay();
  </script>
</body>
</html>
